[project]
name = "pipeline-copilot"
version = "0.1.0"
description = "Synthetic dataset generator for AI hackathon project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pandas",
    "pyarrow",
    "duckdb",
    "mcp",
    "fastapi",
    "uvicorn",
    "openai",
    "langgraph",
    "pyjwt",
    "httpx",
    "python-docx",
    "pypdf"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# Only needed to run scripts/run_validation_suite.py (WP-VAL-002) and the
# localstack_lab/ scripts against the real-AWS-emulation lab -- not a
# runtime dependency of the deployed application itself.
validation = [
    "boto3==1.34.144",
    "botocore==1.34.144",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
