server {
    listen 80;

    # The API container can be recreated independently of this frontend.
    # Resolve the Compose service name at request time so Nginx does not
    # retain a stale Docker container IP and return intermittent 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Scenario Cockpit: proxies to the simulator_backend service so the
    # browser only ever talks to this origin (port 80), never directly to
    # the simulator's internal port 8001 -- consistent with how /api/ is
    # already proxied to the api service, and avoids CORS/mixed-origin
    # complexity for the cockpit's fetch() calls.
    location /sim/ {
        set $sim_upstream simulator:8001;
        rewrite ^/sim/(.*)$ /$1 break;
        proxy_pass http://$sim_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
